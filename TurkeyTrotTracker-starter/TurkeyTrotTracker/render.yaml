services:
  - type: web
    name: turkeytrottracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: EVENT_CODE
        sync: false
      - key: ORGANIZER_CODE
        sync: false
      - key: SECRET_KEY
        generateValue: true
