<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turkey Trot Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    .runner-page { max-width: 520px; margin: 24px auto; padding: 22px; }
    .runner-page label { display:block; margin: 14px 0 6px; font-weight: 600; }
    .runner-page input, .runner-page select {
      box-sizing: border-box; width:100%; min-height:46px; padding:10px 12px;
      font: inherit; border:1px solid #aaa; border-radius:8px; background:#fff; color:#111;
    }
    .runner-actions { display:flex; gap:10px; margin-top:16px; }
    .runner-actions button { flex:1; min-height:46px; cursor:pointer; }
    .runner-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:22px; }
    .runner-stat { padding:14px 8px; border-radius:10px; background:rgba(128,128,128,.12); text-align:center; }
    .runner-stat strong { display:block; font-size:1.35rem; margin-top:5px; }
    #status { margin-top:14px; min-height:1.5em; }
    button:disabled { opacity:.55; cursor:not-allowed; }
  </style>
</head>
<body>
  <main class="runner-page">
    <h1>Turkey Trot Tracker</h1>
    <p>Choose your name, enter the event code, and start sharing your location.</p>

    <label for="runner">Runner</label>
    <select id="runner" name="runner">
      <option value="">Select a runner</option>
      <option value="M.M">M.M</option>
      <option value="G.L">G.L</option>
      <option value="V.L">V.L</option>
      <option value="C.M">C.M</option>
      <option value="E.M">E.M</option>
      <option value="G.M">G.M</option>
      <option value="J.M">J.M</option>
    </select>

    <label for="event-code">Event code</label>
    <input id="event-code" type="password" autocomplete="off" placeholder="Enter event code">

    <div class="runner-actions">
      <button id="start-button" type="button">Start sharing</button>
      <button id="stop-button" type="button" disabled>Stop sharing</button>
    </div>

    <p id="status" role="status" aria-live="polite">Not sharing location.</p>

    <section class="runner-stats" aria-label="Your running stats">
      <div class="runner-stat">Pace<strong id="pace">--:--</strong></div>
      <div class="runner-stat">Time<strong id="elapsed">00:00</strong></div>
      <div class="runner-stat">Miles<strong id="miles">0.00</strong></div>
    </section>
  </main>

  <script>
    (() => {
      const socket = io();
      const runnerSelect = document.getElementById("runner");
      const eventCodeInput = document.getElementById("event-code");
      const startButton = document.getElementById("start-button");
      const stopButton = document.getElementById("stop-button");
      const statusText = document.getElementById("status");
      const paceText = document.getElementById("pace");
      const elapsedText = document.getElementById("elapsed");
      const milesText = document.getElementById("miles");

      let watchId = null;
      let sharing = false;
      let selectedRunner = "";
      let selectedEventCode = "";

      function setStatus(message) {
        statusText.textContent = message;
      }

      function stopLocationWatch() {
        if (watchId !== null && navigator.geolocation) {
          navigator.geolocation.clearWatch(watchId);
        }
        watchId = null;
        sharing = false;
        startButton.disabled = false;
        stopButton.disabled = true;
      }

      function startLocationWatch() {
        if (!navigator.geolocation) {
          setStatus("This browser does not support location sharing.");
          stopLocationWatch();
          return;
        }

        if (watchId !== null) navigator.geolocation.clearWatch(watchId);

        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const coords = position.coords;
            socket.emit("runner_location", {
              runner: selectedRunner,
              event_code: selectedEventCode,
              lat: coords.latitude,
              lng: coords.longitude,
              accuracy: coords.accuracy
            });
            setStatus("Sharing location for " + selectedRunner + ".");
          },
          (error) => {
            const messages = {
              1: "Location permission was denied. Allow location access in your browser.",
              2: "Your location is currently unavailable. Try again in a moment.",
              3: "Location request timed out. Trying again..."
            };
            setStatus(messages[error.code] || "Could not get your location.");
          },
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
        );

        sharing = true;
        startButton.disabled = true;
        stopButton.disabled = false;
        setStatus("Getting your location...");
      }

      startButton.addEventListener("click", () => {
        const runner = runnerSelect.value;
        const eventCode = eventCodeInput.value.trim();

        if (!runner) {
          setStatus("Please select your runner name.");
          runnerSelect.focus();
          return;
        }
        if (!eventCode) {
          setStatus("Please enter the event code.");
          eventCodeInput.focus();
          return;
        }

        selectedRunner = runner;
        selectedEventCode = eventCode;
        startButton.disabled = true;
        setStatus("Connecting...");
        socket.emit("join_runner", {
          runner: selectedRunner,
          event_code: selectedEventCode
        });
      });

      stopButton.addEventListener("click", () => {
        if (sharing) {
          socket.emit("runner_stopped", {
            runner: selectedRunner,
            event_code: selectedEventCode
          });
        }
        stopLocationWatch();
        setStatus("Location sharing stopped.");
      });

      socket.on("share_ready", () => {
        if (!sharing) startLocationWatch();
      });

      socket.on("runner_stats", (stats) => {
        if (stats.pace !== undefined && stats.pace !== null) {
          paceText.textContent = stats.pace;
        }
        if (stats.elapsed !== undefined && stats.elapsed !== null) {
          elapsedText.textContent = stats.elapsed;
        }
        if (stats.miles !== undefined && stats.miles !== null) {
          const miles = Number(stats.miles);
          milesText.textContent = Number.isFinite(miles) ? miles.toFixed(2) : stats.miles;
        }
      });

      socket.on("connect_error", () => {
        setStatus("Connection problem. Refresh the page and try again.");
        startButton.disabled = false;
      });

      socket.on("disconnect", () => {
        if (sharing) {
          stopLocationWatch();
          setStatus("Disconnected. Refresh the page to reconnect.");
        }
      });

      window.addEventListener("beforeunload", () => {
        if (sharing) {
          socket.emit("runner_stopped", {
            runner: selectedRunner,
            event_code: selectedEventCode
          });
        }
      });
    })();
  </script>
</body>
</html>
